<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorSure | Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #172554;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
        }

        .dashboard {
            margin-top: 35px;
        }

        .stat-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #172554;
        }

        .table-container {
            background: white;
            padding: 22px;
            border-radius: 10px;
            margin-top: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .status {
            background: #fff3cd;
            color: #856404;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
        }

        .btn-approve {
            background: #198754;
            color: white;
        }

        .btn-reject {
            background: #dc3545;
            color: white;
        }

        .message {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">MotorSure Admin</a>

        <button class="btn btn-outline-light btn-sm" onclick="logout()">
            Logout
        </button>
    </div>
</nav>

<div class="container dashboard">

    <h2 class="mb-4">Admin Dashboard</h2>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="stat-card">
                <div>Pending Applications</div>
                <div class="stat-number" id="pendingCount">0</div>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <div class="table-container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Policy Applications</h4>
            <button class="btn btn-primary btn-sm" onclick="loadApplications()">
                Refresh
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Application ID</th>
                        <th>Applicant</th>
                        <th>Vehicle Type</th>
                        <th>Policy Type</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="applicationsTable">
                    <tr>
                        <td colspan="6" class="text-center">
                            Loading applications...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const API_URL = "http://localhost:8080/api";

    const token = localStorage.getItem("motorsure_token");

    if (!token) {
        window.location.href = "index.html";
    }

    async function loadApplications() {
        const table = document.getElementById("applicationsTable");

        table.innerHTML = `
            <tr>
                <td colspan="6" class="text-center">Loading...</td>
            </tr>
        `;

        try {
            const response = await fetch(
                `${API_URL}/policies/admin/pending`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                }
            );

            if (!response.ok) {
                throw new Error("Unable to load applications. Check ADMIN access.");
            }

            const applications = await response.json();

            document.getElementById("pendingCount").textContent =
                applications.length;

            if (applications.length === 0) {
                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center">
                            No pending applications found.
                        </td>
                    </tr>
                `;
                return;
            }

            table.innerHTML = applications.map(policy => {
                const applicant =
                    policy.user?.fullName ||
                    policy.user?.name ||
                    policy.user?.email ||
                    "Applicant";

                return `
                    <tr>
                        <td>${escapeHTML(policy.policyNumber || policy.policyId)}</td>
                        <td>${escapeHTML(applicant)}</td>
                        <td>${escapeHTML(policy.vehicleType)}</td>
                        <td>${escapeHTML(policy.policyType)}</td>
                        <td><span class="status">PENDING</span></td>
                        <td>
                            <button class="btn btn-sm btn-approve me-1"
                                onclick="reviewApplication(${policy.policyId}, 'APPROVED')">
                                Approve
                            </button>

                            <button class="btn btn-sm btn-reject"
                                onclick="reviewApplication(${policy.policyId}, 'REJECTED')">
                                Reject
                            </button>
                        </td>
                    </tr>
                `;
            }).join("");

        } catch (error) {
            table.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-danger">
                        ${escapeHTML(error.message)}
                    </td>
                </tr>
            `;

            document.getElementById("pendingCount").textContent = "0";
        }
    }


async function reviewApplication(policyId, decision) {
    const action = decision === "APPROVED" ? "approve" : "reject";

    let sumInsured = null;
    let premiumAmount = null;

    if (decision === "APPROVED") {
        sumInsured = prompt("Enter Sum Insured (₹):");

        if (sumInsured === null) return;

        premiumAmount = prompt("Enter Premium Amount (₹):");

        if (premiumAmount === null) return;

        if (
            !sumInsured.trim() ||
            !premiumAmount.trim() ||
            !Number.isFinite(Number(sumInsured)) ||
            !Number.isFinite(Number(premiumAmount)) ||
            Number(sumInsured) <= 0 ||
            Number(premiumAmount) <= 0
        ) {
            showMessage(
                "Please enter valid positive amounts.",
                "danger"
            );
            return;
        }
    }

    if (!confirm(`Are you sure you want to ${action} this application?`)) {
        return;
    }

    try {
        const params = new URLSearchParams({ decision });

        if (decision === "APPROVED") {
            params.set("sumInsured", sumInsured.trim());
            params.set("premiumAmount", premiumAmount.trim());
        }

        const response = await fetch(
            `${API_URL}/policies/admin/${policyId}/decision?${params.toString()}`,
            {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`
                }
            }
        );

        const result = await response.text();

        if (!response.ok) {
            throw new Error(result || "Unable to process application.");
        }

        showMessage(
            `Application ${decision.toLowerCase()} successfully.`,
            "success"
        );

        loadApplications();

    } catch (error) {
        showMessage(error.message, "danger");
    }
}

    function showMessage(message, type) {
        document.getElementById("message").innerHTML = `
            <div class="alert alert-${type}">
                ${escapeHTML(message)}
            </div>
        `;
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function logout() {
        localStorage.removeItem("motorsure_token");
        window.location.href = "index.html";
    }

    loadApplications();
</script>

</body>
</html>
